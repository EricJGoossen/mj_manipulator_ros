[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-manipulator-ros"
version = "0.1.0"
description = "Generic ROS 2 bridge for mj_manipulator — HardwareContext, mock node, trajectory conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
maintainers = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
dependencies = [
    "numpy",
    "PyYAML>=6.0",
    "mj-manipulator",
    # rclpy, control_msgs, sensor_msgs, trajectory_msgs, std_msgs
    # come from the system ROS 2 install (apt install ros-humble-desktop)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv.sources]
mj-manipulator = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/personalrobotics/mj_manipulator_ros"
Repository = "https://github.com/personalrobotics/mj_manipulator_ros"
Issues = "https://github.com/personalrobotics/mj_manipulator_ros/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/mj_manipulator_ros/__init__.py" = ["F401"]
"src/mj_manipulator_ros/**/__init__.py" = ["F401"]
"tests/test_gripper.py" = ["E402"]
"tests/test_hardware_context.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
